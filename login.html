{% extends "base.html" %}

{% block title %}
Login - Wholesale AI
{% endblock %}

{% block auth_content %}

<div class="login-page">

    <div class="login-card">

        <div class="login-logo">
            📊
        </div>

        <h1>
            Wholesale AI
        </h1>

        <p class="login-subtitle">
            Customer Segmentation
        </p>


        <form method="POST" class="login-form">

            <div class="form-group">

                <label for="username">
                    Username or Email
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username or email"
                    required
                    autocomplete="username"
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password"
                >

            </div>


            <button
                type="submit"
                class="login-button">
                Login
            </button>

        </form>


        <div class="login-register">

            <span>
                Don't have an account?
            </span>

            <a href="{{ url_for('register') }}">
                Create Account
            </a>

        </div>


        <div class="back-home">

            <a href="{{ url_for('landing') }}">
                ← Back to Home
            </a>

        </div>

    </div>

</div>

{% endblock %}
